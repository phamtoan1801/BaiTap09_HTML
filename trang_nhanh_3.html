<body>

<div class="container">

    <h1>BẢNG HỢP NHẤT Ô</h1>

    <h2>Thực hành Colspan và Rowspan</h2>

    <table class="merge-table">

        <tr>
            <td colspan="2">Hợp nhất 2 cột đầu tiên</td>
            <td>Ô 1.3</td>
        </tr>

        <tr>
            <td rowspan="2">Hợp nhất 2 hàng cuối</td>
            <td>Ô 2.2</td>
            <td>Ô 2.3</td>
        </tr>

        <tr>
            <td>Ô 3.2</td>
            <td>Ô 3.3</td>
        </tr>

    </table>

    <p><strong>Colspan:</strong> Hợp nhất các cột theo chiều ngang.</p>
    <p><strong>Rowspan:</strong> Hợp nhất các hàng theo chiều dọc.</p>
